server {
  listen 8080;
  root /usr/share/nginx/html;

  # The build ships a .gz beside each text file; anything without one is compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm text/plain;

  # Hashed bundles never change.
  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker and its manifest must be checked on every load, or a new build is never picked up.
  location ~ ^/(sw\.js|registerSW\.js|site\.webmanifest|theme-preload\.js)$ {
    types {
      application/javascript js;
      application/manifest+json webmanifest;
    }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Client-side routes all load the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
