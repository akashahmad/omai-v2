<!doctype html>
<html lang="en" style="background-color: var(--v2-background-bg-deep, #fafafa)">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <!-- data-sm lets the MetaProvider replace this pre-load title with the app's <Title> tags. -->
    <title data-sm>O M A I +</title>
    <meta name="description" content="O M A I +, your AI agent." />
    <meta name="application-name" content="O M A I +" />
    <meta name="apple-mobile-web-app-title" content="O M A I +" />
    <link rel="icon" type="image/x-icon" href="%OMAI_FAVICON%" />
    <link rel="apple-touch-icon" sizes="180x180" href="%OMAI_APPLE_TOUCH_ICON%" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="O M A I +" />
    <meta property="og:title" content="O M A I +" />
    <meta property="og:description" content="O M A I +, your AI agent." />
    <meta property="og:image" content="/social-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="O M A I +" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="O M A I +" />
    <meta name="twitter:description" content="O M A I +, your AI agent." />
    <meta name="twitter:image" content="/social-share.png" />
    <script id="theme-preload-script" src="/theme-preload.js"></script>
  </head>
  <body
    class="antialiased overscroll-none font-(family-name:--font-family-text) text-[13px] font-[440] overflow-hidden bg-v2-background-bg-deep"
  >
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="flex flex-col h-dvh bg-v2-background-bg-deep p-px"></div>
    <!-- The app icon breathing until the app has rendered (entry.tsx removes it), so a cold start is never blank. -->
    <div id="boot-splash" aria-hidden="true">
      <span class="boot-splash-halo"></span>
      <img src="/web-app-manifest-192x192.png" alt="" width="56" height="56" draggable="false" />
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        animation: boot-splash-enter 240ms ease-out 150ms both;
      }
      #boot-splash img,
      .boot-splash-halo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      #boot-splash img {
        position: relative;
        box-shadow: 0 8px 24px rgb(10 58 120 / 0.25);
        animation: boot-splash-breathe 1.6s ease-in-out infinite;
      }
      .boot-splash-halo {
        position: absolute;
        background: rgb(10 58 120 / 0.3);
        animation: boot-splash-halo 1.6s ease-out infinite;
      }
      @keyframes boot-splash-enter {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      @keyframes boot-splash-breathe {
        50% {
          transform: scale(0.92);
          opacity: 0.75;
        }
      }
      @keyframes boot-splash-halo {
        from {
          transform: scale(0.9);
          opacity: 0.45;
        }
        to {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img,
        .boot-splash-halo {
          animation: none;
        }
      }
    </style>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
