# Builds and pushes the deployment images to Docker Hub. Manual only: Actions > Images > Run workflow.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access),
# and for the web app the control plane's address, as the `api_url` input or the repository variable VITE_OMAI_API_URL.
name: Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: v1
      images:
        description: Which images to build
        required: true
        default: all
        type: choice
        options: [all, controlplane, router, web, microvm]
      api_url:
        description: "Web app only: the control plane's address, e.g. https://api.omai.ch (else the VITE_OMAI_API_URL variable)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: docker.io/jj123dev/omai

jobs:
  services:
    name: ${{ matrix.image }}
    if: inputs.images == 'all' || inputs.images == 'controlplane' || inputs.images == 'router' || inputs.images == 'web'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [controlplane, router, web]
    steps:
      - name: Skip images that weren't asked for
        id: wanted
        run: echo "build=${{ inputs.images == 'all' || inputs.images == matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.wanted.outputs.build == 'true'
      - name: Check the web app's control plane address
        if: steps.wanted.outputs.build == 'true' && matrix.image == 'web'
        env:
          API_URL: ${{ inputs.api_url || vars.VITE_OMAI_API_URL }}
        run: |
          test -n "$API_URL" || { echo "Set the api_url input or the VITE_OMAI_API_URL repository variable"; exit 1; }
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
        if: steps.wanted.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.wanted.outputs.build == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.wanted.outputs.build == 'true'
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ inputs.tag }}
          build-args: |
            VITE_OMAI_API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  microvm:
    name: microvm
    if: inputs.images == 'all' || inputs.images == 'microvm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Only what the smoke test script imports.
      - run: bun install --ignore-scripts --filter @opencode/controlplane
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Builds the image, runs it with a volume and only the VM's variables, and pushes it only if every check passes.
      - name: Build, smoke-test and push
        working-directory: packages/controlplane
        run: bun script/vm-image.ts --image ${{ env.IMAGE_PREFIX }}-microvm --tag ${{ inputs.tag }} --push
