# Builds and pushes the deployment images to Docker Hub. Manual only: Actions > Images > Run workflow.
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with write access),
# and for the web app the control plane's address: the `api_url` input (default https://api.omai.ch), else VITE_OMAI_API_URL.
name: Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: v1
      controlplane:
        description: Control plane
        type: boolean
        default: false
      router:
        description: Router
        type: boolean
        default: false
      web:
        description: Web app
        type: boolean
        default: false
      microvm:
        description: MicroVM (smoke-tested before it is pushed)
        type: boolean
        default: false
      api_url:
        description: "Web app only: the control plane's address (empty: the VITE_OMAI_API_URL variable or secret)"
        required: false
        default: https://api.omai.ch

permissions:
  contents: read

concurrency:
  group: images-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: docker.io/jj123dev/omai

jobs:
  # Turns the ticked boxes into the list of service images to build.
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - id: pick
        env:
          CONTROLPLANE: ${{ inputs.controlplane }}
          ROUTER: ${{ inputs.router }}
          WEB: ${{ inputs.web }}
          MICROVM: ${{ inputs.microvm }}
        run: |
          picked=()
          [ "$CONTROLPLANE" = true ] && picked+=('"controlplane"')
          [ "$ROUTER" = true ] && picked+=('"router"')
          [ "$WEB" = true ] && picked+=('"web"')
          if [ ${#picked[@]} -eq 0 ] && [ "$MICROVM" != true ]; then echo "Tick at least one image"; exit 1; fi
          echo "services=[$(IFS=,; echo "${picked[*]}")]" >> "$GITHUB_OUTPUT"

  services:
    name: ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the web app's control plane address
        if: matrix.image == 'web'
        env:
          API_URL: ${{ inputs.api_url || vars.VITE_OMAI_API_URL || secrets.VITE_OMAI_API_URL }}
        run: |
          test -n "$API_URL" || { echo "Set the api_url input, or a VITE_OMAI_API_URL repository variable or secret"; exit 1; }
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ inputs.tag }}
          build-args: |
            VITE_OMAI_API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  microvm:
    name: microvm
    needs: plan
    if: inputs.microvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Only what the smoke test script imports.
      - run: bun install --ignore-scripts --filter @opencode/controlplane
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Builds the image, runs it with a volume and only the VM's variables, and pushes it only if every check passes.
      - name: Build, smoke-test and push
        working-directory: packages/controlplane
        env:
          TAG: ${{ inputs.tag }}
        run: bun script/vm-image.ts --image "$IMAGE_PREFIX-microvm" --tag "$TAG" --push
